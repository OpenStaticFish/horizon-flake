name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: nix fmt -- --ci
      - run: nix develop --command actionlint
      - run: nix flake check --print-build-logs

      # Bubblewrap needs user namespaces, so run the FHS smoke test outside the Nix build sandbox.
      - name: Launcher smoke test
        run: |
          nix run . -- --version
          nix run . -- --help

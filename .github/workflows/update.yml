name: Update Horizon and flake.lock

on:
  schedule:
    # Same daily, off-round cadence as t3code-desktop-flake (04:37 UTC).
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-flake
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Pin the latest precompiled launcher and refresh Nixpkgs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run update
          nix flake update

      # Full builds run in the separate, read-only Check workflow before anything can merge.
      - run: bun run check
      - run: nix fmt -- --ci
      - run: nix develop --command actionlint

      - name: Open an update PR and request its checks
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$DEFAULT_BRANCH" \
            --state open --label automated-update --json url --jq '.[0].url // empty')"
          if [[ -n "$existing" ]]; then
            echo "An update PR is already open: $existing"
            exit 0
          fi
          if git diff --quiet -- sources.json flake.lock; then
            echo "Horizon and flake.lock are already up to date."
            exit 0
          fi
          branch="automation/horizon-update-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json flake.lock
          git commit -m "chore: update Horizon launcher and flake inputs"
          gh auth setup-git --hostname github.com
          git push origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$DEFAULT_BRANCH" --head "$branch" \
            --label automated-update --title "chore: update Horizon launcher and flake inputs" \
            --body "Scheduled, SHA-256-verified Horizon/Nixpkgs update. Only sources.json and flake.lock may change. The read-only Check workflow must pass before the guarded merge workflow can merge this PR."
          # GITHUB_TOKEN pushes do not trigger push workflows. Dispatch the real checks explicitly.
          gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

name: Merge verified updates

on:
  workflow_run:
    workflows: [Check]
    types: [completed]

permissions: {}

concurrency:
  group: merge-horizon-update
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.actor.login == 'github-actions[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'automation/horizon-update-')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Only trusted default-branch code runs here. NEVER check out the incoming PR or its artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # No dependency installation, PR code, or downloaded executable runs with this token.
      - name: Merge only an eligible, checked bot update
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run scripts/merge-update.ts
